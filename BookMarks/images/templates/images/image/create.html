{% extends 'base.html' %}

{% block title %} Bookmark an Image {% endblock %}

{% block content %}
    <h1>Bookmark an image</h1>
    <img src="{{ requests.GET.url }}" class="image-preview">
    <form method="post">
        {{ form.as_p }}
        {% csrf_token %}
        <input type="submit" value="BookMarl It!">
    </form>
{% endblock content %}
